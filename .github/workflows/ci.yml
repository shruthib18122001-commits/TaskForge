name: ci

on:
  push:
    branches: [ main, master ]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Full matrix: {Debug, ASan, TSan} x {gcc, clang} on Linux.
  # ASan/TSan configs are required to be clean -- a finding fails the job.
  # ---------------------------------------------------------------------------
  linux:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        preset: [ci, ci-asan, ci-tsan]
        include:
          - compiler: gcc
            cc: gcc-13
            cxx: g++-13
          - compiler: clang
            cc: clang-18
            cxx: clang++-18
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
      # Fail hard, print a full report, and symbolize.
      ASAN_OPTIONS: detect_leaks=1:abort_on_error=1:strict_string_checks=1:detect_stack_use_after_return=1
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
      TSAN_OPTIONS: halt_on_error=1:second_deadlock_stack=1
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build gcc-13 g++-13 clang-18

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} -j

      - name: Test
        # Stress tests are long by design; give ctest room.
        run: ctest --preset ${{ matrix.preset }} --timeout 900

  # ---------------------------------------------------------------------------
  # macOS / Apple Silicon: weak memory model. A relaxed-ordering bug that x86
  # TSO papers over can surface here. Debug + TSan only, to keep it short.
  # ---------------------------------------------------------------------------
  macos-arm:
    runs-on: macos-14           # Apple Silicon
    env:
      TSAN_OPTIONS: halt_on_error=1
    steps:
      - uses: actions/checkout@v4
      - name: Install CMake
        run: brew install cmake ninja
      - name: Configure + build + test (Debug)
        run: |
          cmake --preset ci
          cmake --build --preset ci -j
          ctest --preset ci --timeout 900
      - name: Configure + build + test (TSan)
        run: |
          cmake --preset ci-tsan
          cmake --build --preset ci-tsan -j
          ctest --preset ci-tsan --timeout 900

  # ---------------------------------------------------------------------------
  # Stage 9: the deliberately-wrong deque. This job asserts that TSan REPORTS a
  # race in the buggy variant -- i.e. the demonstration itself is tested. If
  # this ever "passes clean" the demo has silently stopped demonstrating.
  # ---------------------------------------------------------------------------
  buggy-ordering-demo:
    runs-on: ubuntu-24.04
    env:
      CC: clang-18
      CXX: clang++-18
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y clang-18
      - name: Build buggy demo under TSan
        run: >
          clang++-18 -std=c++17 -Wall -Wextra -fsanitize=thread
          -fno-omit-frame-pointer -O1 -g -Iinclude
          verify/verify_buggy_deque.cpp -o buggy_demo -pthread
      - name: Expect a TSan race report (nonzero exit)
        run: |
          set +e
          TSAN_OPTIONS=halt_on_error=1 ./buggy_demo > demo.out 2>&1
          rc=$?
          cat demo.out
          echo "exit code: $rc"
          if [ $rc -eq 0 ]; then
            echo "::error::buggy deque ran clean under TSan -- the demo is no longer demonstrating the bug"
            exit 1
          fi
          if ! grep -qiE "WARNING: ThreadSanitizer: data race|value-check FAILED" demo.out; then
            echo "::error::nonzero exit but no recognizable race/corruption signature"
            exit 1
          fi
          echo "OK: buggy variant tripped as expected"

  # ---------------------------------------------------------------------------
  # Charting / analysis scripts: syntax-check and smoke-run against a committed
  # sample CSV so a broken plotter is caught here, not when regenerating figures.
  # ---------------------------------------------------------------------------
  python-scripts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r scripts/requirements.txt
      - name: Compile-check
        run: python -m py_compile scripts/*.py
      - name: Smoke-run plotters on sample data
        run: |
          mkdir -p results/charts
          python scripts/plot_scaling.py     --csv results/csv/sample_scaling.csv     --out results/charts/_ci_scaling.png
          python scripts/plot_granularity.py --csv results/csv/sample_granularity.csv --out results/charts/_ci_gran.png
          python scripts/plot_steal_rate.py  --csv results/csv/sample_steal_rate.csv  --out results/charts/_ci_steal.png
          python scripts/plot_false_sharing.py --csv results/csv/sample_false_sharing.csv --out results/charts/_ci_fs.png
